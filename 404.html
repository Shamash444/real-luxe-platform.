<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Real Luxe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C6A55C;--ivory:#FAF8F5;--charcoal:#1A1A1A;--slate:#6B6B6B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:26px;padding:40px 24px;text-align:center;background:var(--ivory);color:var(--charcoal);
       font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
  .mark{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:.34em;text-transform:uppercase;color:var(--charcoal)}
  .mark span{color:var(--gold);font-style:italic;letter-spacing:.12em}
  h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,46px);font-weight:400;letter-spacing:-.015em}
  h1 em{font-style:italic;color:var(--gold)}
  p{font-size:15px;font-weight:300;color:var(--slate);line-height:1.8;max-width:46ch}
  .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  a.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:999px;
        font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
        transition:background .3s,color .3s,border-color .3s}
  a.solid{background:var(--gold);color:#0A0A0A;border:1px solid var(--gold)}
  a.solid:hover{background:var(--charcoal);border-color:var(--charcoal);color:var(--ivory)}
  a.ghost{border:1px solid rgba(26,26,26,.2);color:var(--charcoal)}
  a.ghost:hover{border-color:var(--gold);color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .topbar{position:fixed;top:16px;right:20px}
  .lang-sel{position:relative}
  .lang-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid rgba(26,26,26,.16);border-radius:999px;background:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--charcoal)}
  .lang-drop{display:none;position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid rgba(26,26,26,.12);border-radius:10px;overflow:hidden;min-width:64px}
  .lang-sel.open .lang-drop{display:block}
  .lang-opt{display:block;width:100%;padding:9px 14px;border:0;background:none;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.1em;color:var(--charcoal);text-align:left}
  .lang-opt:hover,.lang-opt.active{background:rgba(198,165,92,.12);color:var(--gold)}
</style>
<script src="config.js" defer></script>
<script src="script.js" defer></script>
</head>
<body data-page="404">
  <div class="topbar" data-lang-mount></div>
  <div class="mark">Real <span>Luxe</span></div>
  <h1 data-t="e404_title">That page <em>is not here</em></h1>
  <p data-t="e404_body">The link may be out of date, or the property it pointed to is no longer listed. The catalogue below has everything currently available.</p>
  <div class="actions">
    <a class="btn solid" href="catalogue.html" data-t="e404_cta1">See the catalogue</a>
    <a class="btn ghost" href="index.html" data-t="e404_cta2">Home</a>
  </div>
</body>
</html>
